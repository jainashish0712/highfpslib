name: Build CAHighFPS dylib

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Verify CAHighFPS.dylib
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode environment
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          echo "Xcode Version:"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Run Runtime Verification Tests
        run: |
          echo "Compiling and running automated test suite to prevent runtime crashes..."
          xcrun clang -O2 -fobjc-arc \
            -framework Foundation -framework QuartzCore -framework Metal -framework CoreGraphics \
            -Wno-deprecated-declarations -Wno-unguarded-availability-new \
            tests/test_cahighfps.m CAHighFPS.m -o run_tests
          ./run_tests

      - name: Compile Universal iOS CAHighFPS.dylib
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using iPhoneOS SDK at: $SDK_PATH"
          
          # Compile universal arm64 + arm64e iOS dylib
          xcrun -sdk iphoneos clang -O3 \
            -arch arm64 -arch arm64e \
            -shared -dynamiclib \
            -fobjc-arc \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=15.0 \
            -Wno-deprecated-declarations \
            -Wno-unguarded-availability-new \
            -framework Foundation \
            -framework UIKit \
            -framework QuartzCore \
            -framework CoreGraphics \
            -framework Metal \
            -install_name @rpath/CAHighFPS.dylib \
            CAHighFPS.m -o CAHighFPS.dylib

      - name: Code Sign and Verify Binary
        run: |
          codesign -f -s - CAHighFPS.dylib
          echo "Binary details:"
          file CAHighFPS.dylib
          echo "Code signature status:"
          codesign --verify --verbose CAHighFPS.dylib
          echo "Linked frameworks:"
          otool -L CAHighFPS.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CAHighFPS.dylib
          path: CAHighFPS.dylib

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'CAHighFPS Latest Build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: CAHighFPS.dylib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
